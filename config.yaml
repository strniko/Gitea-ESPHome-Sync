name: "Gitea ESPHome Sync"
slug: "gitea_esphome_sync"
description: "Synchronisiert /config/esphome/ mit Gitea mit einem Webhook"
version: "1.0.2"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
map:
  - config:rw
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Gitea Webhook Listener"
options:
  secret: "Supersecretsecret"
  target_branch: "refs/heads/main"
  port: 5000
schema:
  secret: str
  target_branch: str
  port: int
